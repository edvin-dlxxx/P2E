name: mygame_p2e
description: MyGame P2E Flutter foundation.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.7'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^18.1.1
  intl: ^0.20.3
  p2e_design_system:
    path: packages/design_system
  riverpod_annotation: ^4.0.7
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9
  build_runner: ^2.15.1
flutter:
  # Bundled framework font for the accepted native text-selection toolbar.
  # Product control artwork continues to use Figma SVGs through AppIcon only.
  uses-material-design: true
  generate: true

